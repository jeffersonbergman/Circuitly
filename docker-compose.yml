services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: circuitly-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - circuitly-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  circuitly-sql-data: